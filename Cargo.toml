[package]
name = "dice_core"
version = "0.1.0"
edition = "2024"
authors = ["JKaram"]
description = "A robust library for parsing and rolling dice notation like '2d6+3'."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JKaram/dice_core"
readme = "README.md"
keywords = ["dice", "parser", "rng", "ttrpg", "dnd"]
categories = ["games", "parsing", "parser-implementations"]

[dependencies]
nom = "8.0.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_core = "0.9.3"
thiserror = "2.0.17"
